<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TextRank Summarizer</title>
<style>
  :root {
    --bg-0: #0b0e1a;
    --bg-1: #10142a;
    --panel: #141a30;
    --panel-2: #1b2140;
    --panel-3: #212850;
    --border: #2a3155;
    --border-soft: #232a4a;
    --text: #eef0fb;
    --muted: #8b90b3;
    --muted-2: #676d95;
    --accent: #6f8cff;
    --accent-2: #7ef0b8;
    --accent-3: #b18cff;
    --danger: #ff6b7d;
    --warn: #ffc26b;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background:
      radial-gradient(circle at 12% -8%, #2a3468 0%, transparent 42%),
      radial-gradient(circle at 100% 0%, #24345a 0%, transparent 38%),
      var(--bg-0);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333c66; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #454f85; }

  a { color: var(--accent); }

  header {
    padding: 40px 24px 20px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(111, 140, 255, 0.12);
    border: 1px solid rgba(111, 140, 255, 0.35);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 8px var(--accent-2);
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(100deg, #ffffff 10%, var(--accent) 55%, var(--accent-3) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
  }

  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 10px 24px 70px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 22px;
    align-items: start;
  }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 130%);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow);
  }

  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .panel-title h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text);
    padding: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.15s ease;
  }

  textarea::placeholder { color: var(--muted-2); }
  textarea:focus { outline: none; border-color: var(--accent); }

  #inputText { min-height: 280px; }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .slider-wrap {
    flex: 1;
    min-width: 210px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-wrap span {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .slider-wrap span#ratioLabel {
    color: var(--accent);
    font-weight: 700;
    min-width: 34px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }

  .mode-panel {
    display: none;
    flex: 1;
    min-width: 210px;
  }

  .mode-panel.active {
    display: flex;
  }

  #topNInput {
    width: 70px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }

  #topNInput:focus { outline: none; border-color: var(--accent); }

  .mode-hint {
    font-size: 11.5px;
    color: var(--muted-2);
  }

  .mode-hint code {
    background: var(--panel-3);
    padding: 1px 5px;
    border-radius: 4px;
  }

  #lengthModeTabs { margin-top: 16px; }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  #summarizeBtn {
    background: linear-gradient(100deg, var(--accent), var(--accent-3));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14.5px;
    font-weight: 700;
    box-shadow: 0 8px 22px -6px rgba(111, 140, 255, 0.55);
    transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    white-space: nowrap;
  }

  #summarizeBtn:hover { opacity: 0.94; box-shadow: 0 10px 26px -6px rgba(111, 140, 255, 0.7); }
  #summarizeBtn:active { transform: scale(0.97); }
  #summarizeBtn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  /* Reference (ROUGE) collapsible section */
  .ref-section {
    margin-top: 18px;
    border-top: 1px dashed var(--border);
    padding-top: 16px;
  }

  .ref-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    width: 100%;
    padding: 0;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
  }

  .ref-toggle .chevron {
    color: var(--muted);
    transition: transform 0.15s ease;
    font-size: 12px;
  }

  .ref-toggle.open .chevron { transform: rotate(90deg); }

  .ref-toggle .hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
    margin-left: 8px;
  }

  .ref-body {
    display: none;
    margin-top: 14px;
  }

  .ref-body.open { display: block; }

  #referenceText {
    min-height: 110px;
  }

  .ref-file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .file-btn {
    background: var(--panel-3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .file-btn:hover { border-color: var(--accent); }

  #refFileName {
    font-size: 12.5px;
    color: var(--muted);
  }

  .clear-ref {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 12.5px;
    padding: 4px 6px;
    display: none;
  }

  /* Results panel */
  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .stat b { color: var(--text); font-size: 14.5px; display: block; }

  /* ROUGE cards */
  .rouge-block {
    margin-bottom: 18px;
  }

  .rouge-block h3 {
    margin: 0 0 12px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rouge-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .rouge-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 10px;
    text-align: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .rouge-card[data-accuracy-card] {
    cursor: pointer;
  }

  .rouge-card[data-accuracy-card]:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .rouge-card .detail-hint {
    margin-top: 8px;
    font-size: 10.5px;
    color: var(--accent);
    font-weight: 600;
  }

  .gauge {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .gauge::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--panel-2);
  }

  .gauge span {
    position: relative;
    font-size: 15px;
    font-weight: 800;
  }

  .rouge-card .label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }

  .rouge-card .sub {
    font-size: 10.5px;
    color: var(--muted-2);
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .rouge-warning {
    background: rgba(255, 194, 107, 0.1);
    border: 1px solid rgba(255, 194, 107, 0.35);
    color: var(--warn);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12.5px;
    margin-bottom: 18px;
  }

  /* Tabs for summary / full text */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 14px;
    width: fit-content;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
  }

  .tab-btn.active {
    background: var(--panel-3);
    color: var(--text);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .summary-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    max-height: 340px;
  }

  .summary-list li {
    background: rgba(126, 240, 184, 0.07);
    border: 1px solid rgba(126, 240, 184, 0.25);
    border-left: 3px solid var(--accent-2);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.55;
  }

  .full-text {
    font-size: 14px;
    line-height: 1.75;
    max-height: 340px;
    overflow-y: auto;
    color: var(--muted);
  }

  .full-text mark {
    background: rgba(111, 140, 255, 0.25);
    color: var(--text);
    border-radius: 3px;
    padding: 0 2px;
  }

  .placeholder {
    color: var(--muted-2);
    font-size: 13.5px;
    text-align: center;
    padding: 60px 10px;
  }

  .error-box {
    background: rgba(255, 107, 125, 0.1);
    border: 1px solid rgba(255, 107, 125, 0.4);
    color: var(--danger);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 11px;
    font-size: 11.5px;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 7px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    color: var(--muted-2);
    font-size: 11.5px;
    padding-bottom: 34px;
  }

  footer code {
    background: var(--panel-2);
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* ROUGE detail modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 18, 0.65);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-backdrop.open { display: flex; }

  .modal-box {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 130%);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 560px;
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-close:hover { color: var(--text); border-color: var(--accent); }

  .modal-box h3 {
    margin: 0 26px 4px 0;
    font-size: 16.5px;
    font-weight: 800;
  }

  .modal-sub {
    color: var(--muted);
    font-size: 12.5px;
    margin-bottom: 14px;
  }

  .modal-formula {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 12.5px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .modal-calc-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .modal-calc-row:last-of-type { border-bottom: none; }

  .modal-calc-row span { color: var(--muted); }
  .modal-calc-row b { color: var(--text); font-weight: 700; }
  .modal-calc-row b.accent { color: var(--accent-2); }

  .modal-section-title {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    background: var(--panel-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12px;
  }

  .chip-more {
    font-size: 11.5px;
    color: var(--muted-2);
    margin-top: 8px;
  }

  .modal-note {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--muted-2);
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <div class="badge"><span class="dot"></span> Local &middot; Flask API</div>
  <h1>TextRank Summarizer</h1>
  <p>Tóm tắt trích xuất bằng phương pháp xếp hạng đồ thị</p>
</header>

<main>
  <section class="panel">
    <div class="panel-title"><h2>Văn bản gốc</h2></div>
    <textarea id="inputText" placeholder="Dán văn bản cần tóm tắt , hoặc chọn file bên dưới..."></textarea>

    <div class="ref-file-row" style="margin-top:10px;">
      <label class="file-btn">
        Chọn file văn bản
        <input type="file" id="inputFile" style="display:none;" />
      </label>
      <span id="inputFileName"></span>
      <button class="clear-ref" id="clearInputBtn">Xoá</button>
    </div>

    <div class="tabs" id="lengthModeTabs">
      <button class="tab-btn active" data-mode="ratio">Theo % số câu</button>
      <button class="tab-btn" data-mode="fixed">Số câu cố định</button>
    </div>

    <div class="controls">
      <div class="mode-panel active" data-mode-panel="ratio">
        <div class="slider-wrap">
          <span>Độ dài tóm tắt</span>
          <input type="range" id="ratioSlider" min="10" max="70" value="30" step="5" />
          <span id="ratioLabel">30%</span>
        </div>
      </div>
      <div class="mode-panel" data-mode-panel="fixed">
        <div class="slider-wrap">
          <span>Số câu tóm tắt</span>
          <input type="number" id="topNInput" min="1" value="18" />
        </div>
      </div>
      <button id="summarizeBtn">Tóm tắt</button>
    </div>

    <div class="ref-section">
      <button class="ref-toggle" id="refToggle">
        <span>📎 Thêm tóm tắt tham chiếu để đo độ tương đồng <span class="hint">(tuỳ chọn)</span></span>
        <span class="chevron">›</span>
      </button>
      <div class="ref-body" id="refBody">
        <textarea id="referenceText" placeholder="Dán tóm tắt tham chiếu (ví dụ nội dung file trong DUC_SUM) hoặc chọn file bên dưới..."></textarea>
        <div class="ref-file-row">
          <label class="file-btn">
            Chọn file tham chiếu
            <input type="file" id="refFile" style="display:none;" />
          </label>
          <span id="refFileName"></span>
          <button class="clear-ref" id="clearRefBtn">Xoá tham chiếu</button>
        </div>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <h2>Kết quả</h2>
      <button class="copy-btn" id="copyBtn" style="display:none;">Copy tóm tắt</button>
    </div>

    <div id="resultArea">
      <div class="placeholder">Kết quả tóm tắt sẽ hiện ở đây.</div>
    </div>
  </section>
</main>

<footer>Chạy local qua Flask API (<code>/api/summarize</code>) &middot; thuật toán TextRank trong <code>src/</code></footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API_URL = "/api/summarize";

const inputText    = document.getElementById("inputText");
const inputFile      = document.getElementById("inputFile");
const inputFileName  = document.getElementById("inputFileName");
const clearInputBtn  = document.getElementById("clearInputBtn");
const ratioSlider  = document.getElementById("ratioSlider");
const ratioLabel   = document.getElementById("ratioLabel");
const topNInput    = document.getElementById("topNInput");
const lengthModeTabs = document.getElementById("lengthModeTabs");
const summarizeBtn = document.getElementById("summarizeBtn");
const errorBox     = document.getElementById("errorBox");
const resultArea   = document.getElementById("resultArea");
const copyBtn      = document.getElementById("copyBtn");

const refToggle    = document.getElementById("refToggle");
const refBody       = document.getElementById("refBody");
const referenceText = document.getElementById("referenceText");
const refFile        = document.getElementById("refFile");
const refFileName    = document.getElementById("refFileName");
const clearRefBtn    = document.getElementById("clearRefBtn");

const modalBackdrop = document.getElementById("modalBackdrop");
const modalBody      = document.getElementById("modalBody");
const modalClose      = document.getElementById("modalClose");

let lastSummary = [];
let lengthMode = "ratio";

ratioSlider.addEventListener("input", () => {
  ratioLabel.textContent = ratioSlider.value + "%";
});

lengthModeTabs.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    lengthModeTabs.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    lengthMode = btn.dataset.mode;

    document.querySelectorAll(".mode-panel").forEach(panel => {
      panel.classList.toggle("active", panel.dataset.modePanel === lengthMode);
    });
  });
});

refToggle.addEventListener("click", () => {
  refToggle.classList.toggle("open");
  refBody.classList.toggle("open");
});

inputFile.addEventListener("change", async () => {
  const file = inputFile.files[0];
  if (!file) return;
  const content = await file.text();
  inputText.value = content;
  inputFileName.textContent = file.name;
  clearInputBtn.style.display = "inline-block";
  clearError();
});

clearInputBtn.addEventListener("click", () => {
  inputText.value = "";
  inputFile.value = "";
  inputFileName.textContent = "";
  clearInputBtn.style.display = "none";
});

inputText.addEventListener("input", () => {
  clearInputBtn.style.display = inputText.value.trim() ? "inline-block" : "none";
});

refFile.addEventListener("change", async () => {
  const file = refFile.files[0];
  if (!file) return;
  const content = await file.text();
  referenceText.value = content;
  refFileName.textContent = file.name;
  clearRefBtn.style.display = "inline-block";
});

clearRefBtn.addEventListener("click", () => {
  referenceText.value = "";
  refFile.value = "";
  refFileName.textContent = "";
  clearRefBtn.style.display = "none";
});

referenceText.addEventListener("input", () => {
  clearRefBtn.style.display = referenceText.value.trim() ? "inline-block" : "none";
});

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}

function clearError() {
  errorBox.style.display = "none";
  errorBox.textContent = "";
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function summarize() {
  const text = inputText.value.trim();
  const reference = referenceText.value.trim();
  clearError();

  if (!text) {
    showError("Vui lòng nhập văn bản cần tóm tắt.");
    return;
  }

  if (lengthMode === "fixed" && (!topNInput.value || Number(topNInput.value) < 1)) {
    showError("Vui lòng nhập số câu tóm tắt hợp lệ (>= 1).");
    return;
  }

  summarizeBtn.disabled = true;
  summarizeBtn.innerHTML = '<span class="spinner"></span>Đang xử lý...';
  resultArea.innerHTML = '<div class="placeholder">Đang phân tích văn bản...</div>';
  copyBtn.style.display = "none";

  const lengthPayload = lengthMode === "fixed"
    ? { top_n: Number(topNInput.value) }
    : { ratio: Number(ratioSlider.value) / 100 };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        ...lengthPayload,
        reference: reference || undefined,
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      showError(data.error || "Có lỗi xảy ra, vui lòng thử lại.");
      resultArea.innerHTML = '<div class="placeholder">Kết quả tóm tắt sẽ hiện ở đây.</div>';
      return;
    }

    renderResult(data);
  } catch (err) {
    showError("Không kết nối được tới server. Kiểm tra xem Flask (api.py) đã chạy chưa.");
    resultArea.innerHTML = '<div class="placeholder">Kết quả tóm tắt sẽ hiện ở đây.</div>';
  } finally {
    summarizeBtn.disabled = false;
    summarizeBtn.textContent = "Tóm tắt";
  }
}

function gaugeGradient(pct) {
  const deg = Math.round(pct * 3.6);
  return `conic-gradient(var(--accent) 0deg ${deg}deg, var(--panel-3) ${deg}deg 360deg)`;
}

function accuracyCard(pct, hasDetail) {
  return `
    <div class="rouge-card"${hasDetail ? ' data-accuracy-card="1"' : ""}>
      <div class="gauge" style="background:${gaugeGradient(pct)}">
        <span>${pct}%</span>
      </div>
      <div class="label">Độ tương đồng</div>
      <div class="sub">
        <span>Cosine TF-IDF so với tham chiếu</span>
      </div>
      ${hasDetail ? '<div class="detail-hint">Xem chi tiết ›</div>' : ""}
    </div>`;
}

let lastAccuracyScore = null;
let lastAccuracyDetail = null;

function openAccuracyModal() {
  if (lastAccuracyScore === null) return;
  const d = lastAccuracyDetail;
  const pct = Math.round(lastAccuracyScore * 100);

  const shown = d ? d.shared_words || [] : [];
  const chipsHtml = shown.length
    ? `<div class="chip-list">${shown.map(w => `<span class="chip">${escapeHtml(w)}</span>`).join("")}</div>`
    : `<div class="chip-more">Không có từ khoá trùng nào.</div>`;

  modalBody.innerHTML = `
    <h3>Độ tương đồng với bản tham chiếu — Cosine Similarity (TF-IDF)</h3>
    <div class="modal-sub">Số liệu cụ thể tạo ra điểm ${pct}% bên dưới</div>

    <div class="modal-formula">Similarity = (A . B) / (|A| × |B|)<br>trong đó A, B là vector TF-IDF của bản tóm tắt hệ thống và bản tham chiếu</div>

    ${d ? `
    <div class="modal-calc-row"><span>Số từ khoá trong bản tóm tắt hệ thống</span><b>${d.candidate_word_count}</b></div>
    <div class="modal-calc-row"><span>Số từ khoá trong bản tham chiếu</span><b>${d.reference_word_count}</b></div>
    <div class="modal-calc-row"><span>Số từ khoá trùng ở cả 2 bên</span><b>${d.shared_total}</b></div>
    ` : ""}
    <div class="modal-calc-row"><span>Cosine Similarity (điểm hiển thị trên thẻ)</span><b class="accent">${pct}%</b></div>

    <div class="modal-section-title">Từ khoá xuất hiện ở cả bản tóm tắt và bản tham chiếu</div>
    ${chipsHtml}

    <div class="modal-note">Lưu ý: Đây chỉ xét độ tương đồng dựa trên từ vựng nên nếu hai câu diễn đạt có ý giống nhau nhưng dùng từ khác nhau sẽ không được xem là trùng nhau</div>
  `;

  modalBackdrop.classList.add("open");
}

function closeAccuracyModal() {
  modalBackdrop.classList.remove("open");
}

modalClose.addEventListener("click", closeAccuracyModal);
modalBackdrop.addEventListener("click", (e) => {
  if (e.target === modalBackdrop) closeAccuracyModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeAccuracyModal();
});

function renderResult(data) {
  lastSummary = data.summary;

  const statsHtml = `
    <div class="stats">
      <div class="stat"><b>${data.sentence_count}</b>Câu gốc</div>
      <div class="stat"><b>${data.summary_count}</b>Câu tóm tắt</div>
      <div class="stat"><b>${Math.round(data.compression * 100)}%</b>Tỉ lệ nén</div>
    </div>`;

  lastAccuracyScore = typeof data.accuracy === "number" ? data.accuracy : null;
  lastAccuracyDetail = data.accuracy_detail || null;

  let accuracyHtml = "";
  if (typeof data.accuracy === "number") {
    const pct = Math.round(data.accuracy * 100);
    accuracyHtml = `
      <div class="rouge-block">
        <h3>📊 Độ tương đồng Cosine TF-IDF với bản tham chiếu${lastAccuracyDetail ? ' <span style="font-weight:400; text-transform:none; letter-spacing:0;">— bấm vào thẻ để xem chi tiết</span>' : ""}</h3>
        <div class="rouge-grid">
          ${accuracyCard(pct, !!lastAccuracyDetail)}
        </div>
      </div>`;
  } else if (data.accuracy_warning) {
    accuracyHtml = `<div class="rouge-warning">⚠️ ${escapeHtml(data.accuracy_warning)}</div>`;
  }

  const summaryHtml = `
    <ol class="summary-list">
      ${data.summary.map(s => `<li>${escapeHtml(s)}</li>`).join("")}
    </ol>`;

  const fullTextHtml = `
    <div class="full-text">
      ${data.sentences.map(s =>
        s.in_summary
          ? `<mark title="score: ${s.score}">${escapeHtml(s.text)}</mark> `
          : `${escapeHtml(s.text)} `
      ).join("")}
    </div>`;

  const tabsHtml = `
    <div class="tabs">
      <button class="tab-btn active" data-tab="summary">Câu tóm tắt</button>
      <button class="tab-btn" data-tab="full">Toàn văn (tô sáng)</button>
    </div>
    <div class="tab-panel active" data-panel="summary">${summaryHtml}</div>
    <div class="tab-panel" data-panel="full">${fullTextHtml}</div>`;

  resultArea.innerHTML = statsHtml + accuracyHtml + tabsHtml;
  copyBtn.style.display = "inline-block";

  resultArea.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      resultArea.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      resultArea.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      resultArea.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.add("active");
    });
  });

  if (lastAccuracyDetail) {
    resultArea.querySelectorAll("[data-accuracy-card]").forEach(card => {
      card.addEventListener("click", openAccuracyModal);
    });
  }
}

copyBtn.addEventListener("click", () => {
  if (!lastSummary.length) return;
  const formatted = lastSummary.map((s, i) => `${i + 1}. ${s}`).join("\n");
  navigator.clipboard.writeText(formatted);
  copyBtn.textContent = "Đã copy!";
  setTimeout(() => (copyBtn.textContent = "Copy tóm tắt"), 1500);
});

summarizeBtn.addEventListener("click", summarize);

inputText.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    summarize();
  }
});
</script>

</body>
</html>
