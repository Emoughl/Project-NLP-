<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TextRank Summarizer</title>
<style>
  :root {
    --bg-0: #0b0e1a;
    --bg-1: #10142a;
    --panel: #141a30;
    --panel-2: #1b2140;
    --panel-3: #212850;
    --border: #2a3155;
    --border-soft: #232a4a;
    --text: #eef0fb;
    --muted: #8b90b3;
    --muted-2: #676d95;
    --accent: #6f8cff;
    --accent-2: #7ef0b8;
    --accent-3: #b18cff;
    --danger: #ff6b7d;
    --warn: #ffc26b;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background:
      radial-gradient(circle at 12% -8%, #2a3468 0%, transparent 42%),
      radial-gradient(circle at 100% 0%, #24345a 0%, transparent 38%),
      var(--bg-0);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333c66; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #454f85; }

  a { color: var(--accent); }

  header {
    padding: 40px 24px 20px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(111, 140, 255, 0.12);
    border: 1px solid rgba(111, 140, 255, 0.35);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 8px var(--accent-2);
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(100deg, #ffffff 10%, var(--accent) 55%, var(--accent-3) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
  }

  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 10px 24px 70px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 22px;
    align-items: start;
  }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 130%);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow);
  }

  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .panel-title h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text);
    padding: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.15s ease;
  }

  textarea::placeholder { color: var(--muted-2); }
  textarea:focus { outline: none; border-color: var(--accent); }

  #inputText { min-height: 280px; }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .slider-wrap {
    flex: 1;
    min-width: 210px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-wrap span {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .slider-wrap span#ratioLabel {
    color: var(--accent);
    font-weight: 700;
    min-width: 34px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  #summarizeBtn {
    background: linear-gradient(100deg, var(--accent), var(--accent-3));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14.5px;
    font-weight: 700;
    box-shadow: 0 8px 22px -6px rgba(111, 140, 255, 0.55);
    transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    white-space: nowrap;
  }

  #summarizeBtn:hover { opacity: 0.94; box-shadow: 0 10px 26px -6px rgba(111, 140, 255, 0.7); }
  #summarizeBtn:active { transform: scale(0.97); }
  #summarizeBtn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  /* Reference (ROUGE) collapsible section */
  .ref-section {
    margin-top: 18px;
    border-top: 1px dashed var(--border);
    padding-top: 16px;
  }

  .ref-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    width: 100%;
    padding: 0;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
  }

  .ref-toggle .chevron {
    color: var(--muted);
    transition: transform 0.15s ease;
    font-size: 12px;
  }

  .ref-toggle.open .chevron { transform: rotate(90deg); }

  .ref-toggle .hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
    margin-left: 8px;
  }

  .ref-body {
    display: none;
    margin-top: 14px;
  }

  .ref-body.open { display: block; }

  #referenceText {
    min-height: 110px;
  }

  .ref-file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .file-btn {
    background: var(--panel-3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .file-btn:hover { border-color: var(--accent); }

  #refFileName {
    font-size: 12.5px;
    color: var(--muted);
  }

  .clear-ref {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 12.5px;
    padding: 4px 6px;
    display: none;
  }

  /* Results panel */
  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .stat b { color: var(--text); font-size: 14.5px; display: block; }

  /* ROUGE cards */
  .rouge-block {
    margin-bottom: 18px;
  }

  .rouge-block h3 {
    margin: 0 0 12px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rouge-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .rouge-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 10px;
    text-align: center;
  }

  .gauge {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .gauge::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--panel-2);
  }

  .gauge span {
    position: relative;
    font-size: 15px;
    font-weight: 800;
  }

  .rouge-card .label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }

  .rouge-card .sub {
    font-size: 10.5px;
    color: var(--muted-2);
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .rouge-warning {
    background: rgba(255, 194, 107, 0.1);
    border: 1px solid rgba(255, 194, 107, 0.35);
    color: var(--warn);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12.5px;
    margin-bottom: 18px;
  }

  /* Tabs for summary / full text */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 14px;
    width: fit-content;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
  }

  .tab-btn.active {
    background: var(--panel-3);
    color: var(--text);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .summary-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    max-height: 340px;
  }

  .summary-list li {
    background: rgba(126, 240, 184, 0.07);
    border: 1px solid rgba(126, 240, 184, 0.25);
    border-left: 3px solid var(--accent-2);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.55;
  }

  .full-text {
    font-size: 14px;
    line-height: 1.75;
    max-height: 340px;
    overflow-y: auto;
    color: var(--muted);
  }

  .full-text mark {
    background: rgba(111, 140, 255, 0.25);
    color: var(--text);
    border-radius: 3px;
    padding: 0 2px;
  }

  .placeholder {
    color: var(--muted-2);
    font-size: 13.5px;
    text-align: center;
    padding: 60px 10px;
  }

  .error-box {
    background: rgba(255, 107, 125, 0.1);
    border: 1px solid rgba(255, 107, 125, 0.4);
    color: var(--danger);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 11px;
    font-size: 11.5px;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 7px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    color: var(--muted-2);
    font-size: 11.5px;
    padding-bottom: 34px;
  }

  footer code {
    background: var(--panel-2);
    padding: 1px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="badge"><span class="dot"></span> Local &middot; Flask API</div>
  <h1>TextRank Summarizer</h1>
  <p>Tóm tắt trích xuất bằng TF-IDF + Cosine Similarity + PageRank &middot; đánh giá bằng ROUGE</p>
</header>

<main>
  <section class="panel">
    <div class="panel-title"><h2>Văn bản gốc</h2></div>
    <textarea id="inputText" placeholder="Dán văn bản (tiếng Anh) cần tóm tắt vào đây..."></textarea>

    <div class="controls">
      <div class="slider-wrap">
        <span>Độ dài tóm tắt</span>
        <input type="range" id="ratioSlider" min="10" max="70" value="30" step="5" />
        <span id="ratioLabel">30%</span>
      </div>
      <button id="summarizeBtn">Tóm tắt</button>
    </div>

    <div class="ref-section">
      <button class="ref-toggle" id="refToggle">
        <span>📎 Thêm tóm tắt tham chiếu để tính điểm ROUGE <span class="hint">(tuỳ chọn)</span></span>
        <span class="chevron">›</span>
      </button>
      <div class="ref-body" id="refBody">
        <textarea id="referenceText" placeholder="Dán tóm tắt tham chiếu (ví dụ nội dung file trong DUC_SUM) hoặc tải file .txt bên dưới..."></textarea>
        <div class="ref-file-row">
          <label class="file-btn">
            Chọn file .txt
            <input type="file" id="refFile" accept=".txt" style="display:none;" />
          </label>
          <span id="refFileName"></span>
          <button class="clear-ref" id="clearRefBtn">Xoá tham chiếu</button>
        </div>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <h2>Kết quả</h2>
      <button class="copy-btn" id="copyBtn" style="display:none;">Copy tóm tắt</button>
    </div>

    <div id="resultArea">
      <div class="placeholder">Kết quả tóm tắt sẽ hiện ở đây.</div>
    </div>
  </section>
</main>

<footer>Chạy local qua Flask API (<code>/api/summarize</code>) &middot; thuật toán TextRank trong <code>src/</code></footer>

<script>
const API_URL = "/api/summarize";

const inputText    = document.getElementById("inputText");
const ratioSlider  = document.getElementById("ratioSlider");
const ratioLabel   = document.getElementById("ratioLabel");
const summarizeBtn = document.getElementById("summarizeBtn");
const errorBox     = document.getElementById("errorBox");
const resultArea   = document.getElementById("resultArea");
const copyBtn      = document.getElementById("copyBtn");

const refToggle    = document.getElementById("refToggle");
const refBody       = document.getElementById("refBody");
const referenceText = document.getElementById("referenceText");
const refFile        = document.getElementById("refFile");
const refFileName    = document.getElementById("refFileName");
const clearRefBtn    = document.getElementById("clearRefBtn");

let lastSummary = [];

ratioSlider.addEventListener("input", () => {
  ratioLabel.textContent = ratioSlider.value + "%";
});

refToggle.addEventListener("click", () => {
  refToggle.classList.toggle("open");
  refBody.classList.toggle("open");
});

refFile.addEventListener("change", async () => {
  const file = refFile.files[0];
  if (!file) return;
  const content = await file.text();
  referenceText.value = content;
  refFileName.textContent = file.name;
  clearRefBtn.style.display = "inline-block";
});

clearRefBtn.addEventListener("click", () => {
  referenceText.value = "";
  refFile.value = "";
  refFileName.textContent = "";
  clearRefBtn.style.display = "none";
});

referenceText.addEventListener("input", () => {
  clearRefBtn.style.display = referenceText.value.trim() ? "inline-block" : "none";
});

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}

function clearError() {
  errorBox.style.display = "none";
  errorBox.textContent = "";
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function summarize() {
  const text = inputText.value.trim();
  const reference = referenceText.value.trim();
  clearError();

  if (!text) {
    showError("Vui lòng nhập văn bản cần tóm tắt.");
    return;
  }

  summarizeBtn.disabled = true;
  summarizeBtn.innerHTML = '<span class="spinner"></span>Đang xử lý...';
  resultArea.innerHTML = '<div class="placeholder">Đang phân tích văn bản...</div>';
  copyBtn.style.display = "none";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        ratio: Number(ratioSlider.value) / 100,
        reference: reference || undefined,
      }),
    });

    const data = await res.json();

    if (!res.ok) {
      showError(data.error || "Có lỗi xảy ra, vui lòng thử lại.");
      resultArea.innerHTML = '<div class="placeholder">Kết quả tóm tắt sẽ hiện ở đây.</div>';
      return;
    }

    renderResult(data);
  } catch (err) {
    showError("Không kết nối được tới server. Kiểm tra xem Flask (api.py) đã chạy chưa.");
    resultArea.innerHTML = '<div class="placeholder">Kết quả tóm tắt sẽ hiện ở đây.</div>';
  } finally {
    summarizeBtn.disabled = false;
    summarizeBtn.textContent = "Tóm tắt";
  }
}

function gaugeGradient(pct) {
  const deg = Math.round(pct * 3.6);
  return `conic-gradient(var(--accent) 0deg ${deg}deg, var(--panel-3) ${deg}deg 360deg)`;
}

function rougeCard(label, metric) {
  const pct = Math.round(metric.fmeasure * 100);
  return `
    <div class="rouge-card">
      <div class="gauge" style="background:${gaugeGradient(pct)}">
        <span>${pct}%</span>
      </div>
      <div class="label">${label}</div>
      <div class="sub">
        <span>P ${Math.round(metric.precision * 100)}%</span>
        <span>R ${Math.round(metric.recall * 100)}%</span>
      </div>
    </div>`;
}

function renderResult(data) {
  lastSummary = data.summary;

  const statsHtml = `
    <div class="stats">
      <div class="stat"><b>${data.sentence_count}</b>Câu gốc</div>
      <div class="stat"><b>${data.summary_count}</b>Câu tóm tắt</div>
      <div class="stat"><b>${Math.round(data.compression * 100)}%</b>Tỉ lệ nén</div>
    </div>`;

  let rougeHtml = "";
  if (data.rouge) {
    rougeHtml = `
      <div class="rouge-block">
        <h3>📊 Điểm ROUGE (so với tham chiếu)</h3>
        <div class="rouge-grid">
          ${rougeCard("ROUGE-1", data.rouge.rouge1)}
          ${rougeCard("ROUGE-2", data.rouge.rouge2)}
          ${rougeCard("ROUGE-L", data.rouge.rougeL)}
        </div>
      </div>`;
  } else if (data.rouge_warning) {
    rougeHtml = `<div class="rouge-warning">⚠️ ${escapeHtml(data.rouge_warning)}</div>`;
  }

  const summaryHtml = `
    <ol class="summary-list">
      ${data.summary.map(s => `<li>${escapeHtml(s)}</li>`).join("")}
    </ol>`;

  const fullTextHtml = `
    <div class="full-text">
      ${data.sentences.map(s =>
        s.in_summary
          ? `<mark title="score: ${s.score}">${escapeHtml(s.text)}</mark> `
          : `${escapeHtml(s.text)} `
      ).join("")}
    </div>`;

  const tabsHtml = `
    <div class="tabs">
      <button class="tab-btn active" data-tab="summary">Câu tóm tắt</button>
      <button class="tab-btn" data-tab="full">Toàn văn (tô sáng)</button>
    </div>
    <div class="tab-panel active" data-panel="summary">${summaryHtml}</div>
    <div class="tab-panel" data-panel="full">${fullTextHtml}</div>`;

  resultArea.innerHTML = statsHtml + rougeHtml + tabsHtml;
  copyBtn.style.display = "inline-block";

  resultArea.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      resultArea.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      resultArea.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      resultArea.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.add("active");
    });
  });
}

copyBtn.addEventListener("click", () => {
  if (!lastSummary.length) return;
  navigator.clipboard.writeText(lastSummary.join(" "));
  copyBtn.textContent = "Đã copy!";
  setTimeout(() => (copyBtn.textContent = "Copy tóm tắt"), 1500);
});

summarizeBtn.addEventListener("click", summarize);

inputText.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    summarize();
  }
});
</script>

</body>
</html>
